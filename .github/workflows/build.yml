name: Build AIClient for iOS 6

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build .deb and .ipa
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Theos dependencies
        run: |
          brew install ldid dpkg wget xz
          # Install Theos
          git clone --depth=1 https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          export THEOS=/opt/theos
          # Install iOS 6.1 SDK for legacy support
          if [ ! -d "$THEOS/sdks/iPhoneOS6.1.sdk" ]; then
            mkdir -p $THEOS/sdks
            cd $THEOS/sdks
            wget -q https://github.com/haikieu/xcode-sdks/releases/download/6.1/iPhoneOS6.1.sdk.tar.xz
            tar -xf iPhoneOS6.1.sdk.tar.xz
            rm iPhoneOS6.1.sdk.tar.xz
          fi

      - name: Setup environment
        run: |
          export THEOS=/opt/theos
          export SDKROOT=$THEOS/sdks/iPhoneOS6.1.sdk
          export PATH=$THEOS/bin:$PATH
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "SDKROOT=$THEOS/sdks/iPhoneOS6.1.sdk" >> $GITHUB_ENV

      - name: Build AIClient
        working-directory: ./AIClient
        env:
          THEOS: /opt/theos
          SDKROOT: /opt/theos/sdks/iPhoneOS6.1.sdk
        run: |
          export THEOS=/opt/theos
          export SDKROOT=$THEOS/sdks/iPhoneOS6.1.sdk
          export PATH=$THEOS/bin:$PATH

          # Verify SDK
          ls -la $SDKROOT

          # Build with iOS 6 SDK
          make clean
          make package FINALPACKAGE=1 DEBUG=0

          # List outputs
          ls -la packages/

      - name: Convert .deb to .ipa
        working-directory: ./AIClient
        env:
          THEOS: /opt/theos
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH

          DEB_FILE=$(ls packages/*.deb | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "No .deb file found!"
            exit 1
          fi

          # Extract .deb
          mkdir -p build/ipa/Payload
          dpkg-deb -x "$DEB_FILE" build/ipa

          # Find .app
          APP_PATH=$(find build/ipa -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in .deb!"
            exit 1
          fi

          # Create .ipa
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r "../../AIClient.ipa" Payload
          cd ../..

          echo "IPA created: $(pwd)/AIClient.ipa"
          ls -la AIClient.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIClient-build
          path: |
            AIClient/packages/*.deb
            AIClient/AIClient.ipa
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: AIClient-build
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: AIClient ${{ github.ref_name }}
          body: |
            ## AIClient for iOS 6+

            **Supported iOS versions:** 6.0 - 17+

            **Architectures:** armv7, armv7s, arm64

            **Providers:** OpenAI, Anthropic, Google Gemini, NVIDIA NIM

            **Themes:** Skeuomorphic (iOS 6), Minimalist (iOS 13+), Claude Code (Terminal)

            ### Installation

            **For iOS 13+:** Direct connection, no proxy needed.

            **For iOS 6-12:** Use TLS proxy:
            - Local: `proxy/main.py` (Python)
            - Cloud: Free Cloudflare Worker (`proxy/worker.js`)

            **Install .ipa:** Sideloadly, TrollStore, or Cydia

            ### Changes
            See commit history for details.
          files: |
            artifacts/*.deb
            artifacts/*.ipa
          draft: false
          prerelease: false